apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: my-eks-cluster
  region: us-east-1
  version: "1.31"

# Explicitly define availability zones
availabilityZones: ["us-east-1a", "us-east-1b"]

iam:
  withOIDC: true

managedNodeGroups:
  - name: managed-ng-1
    instanceType: t3.medium
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    ssh:
      allow: false